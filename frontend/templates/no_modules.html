<!DOCTYPE html>
<html lang="{{ lang | default('en') }}"
      dir="{{ 'rtl' if is_rtl else 'ltr' }}"
      data-lang="{{ lang | default('en') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ _t("no_modules.heading") }} — LaVerde ERP AI Engine</title>

  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="mask-icon" href="/static/favicon.svg" color="#4f46e5">
  <link rel="stylesheet" href="/static/vendor/fonts.css">
  <link rel="stylesheet" href="/static/css/app.css">

  <script>
    (function() {
      var theme = localStorage.getItem('crmTheme') || 'system';
      var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
</head>

<body class="min-h-screen bg-neutral-50 dark:bg-neutral-950 flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <div class="bg-white dark:bg-neutral-900 rounded-2xl shadow-sm border border-neutral-200 dark:border-neutral-800 p-8">

      <div class="flex flex-col items-center gap-3 mb-6">
        <div class="w-12 h-12 rounded-xl bg-neutral-100 dark:bg-neutral-800 flex items-center justify-center">
          <svg class="w-6 h-6 text-neutral-500 dark:text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <div class="text-center">
          <h1 class="text-lg font-bold text-neutral-900 dark:text-neutral-100">{{ _t("no_modules.heading") }}</h1>
          <p class="text-sm text-neutral-500 dark:text-neutral-400 mt-1">{{ _t("no_modules.body") }}</p>
        </div>
      </div>

      <a href="/logout"
         class="w-full py-2.5 px-4 rounded-lg text-sm font-semibold text-center block
                bg-primary-600 hover:bg-primary-700 active:bg-primary-800
                text-white transition-colors focus:outline-none focus:ring-2
                focus:ring-primary-500 focus:ring-offset-2 dark:focus:ring-offset-neutral-900">
        {{ _t("Logout") }}
      </a>

    </div>
  </div>

</body>
</html>
