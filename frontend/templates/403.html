<!DOCTYPE html>
<html lang="{{ lang | default('en') }}"
      dir="{{ 'rtl' if is_rtl else 'ltr' }}"
      data-lang="{{ lang | default('en') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ _t("forbidden.heading") }} — LaVerde ERP AI Engine</title>

  <link rel="icon" type="image/svg+xml" href="{{ static_url('favicon.svg') }}">
  <link rel="mask-icon" href="{{ static_url('favicon.svg') }}" color="#4f46e5">
  <link rel="stylesheet" href="{{ static_url('vendor/fonts.css') }}">
  <link rel="stylesheet" href="{{ static_url('css/app.css') }}">

  <script>
    (function() {
      var theme = localStorage.getItem('crmTheme') || 'system';
      var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
</head>

<body class="min-h-screen bg-neutral-50 dark:bg-neutral-950 flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <div class="bg-white dark:bg-neutral-900 rounded-2xl shadow-sm border border-neutral-200 dark:border-neutral-800 p-8">

      <div class="flex flex-col items-center gap-3 mb-6">
        <div class="w-12 h-12 rounded-xl bg-red-100 dark:bg-red-900/30 flex items-center justify-center">
          <svg class="w-6 h-6 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <div class="text-center">
          <h1 class="text-lg font-bold text-neutral-900 dark:text-neutral-100">{{ _t("forbidden.heading") }}</h1>
          <p class="text-sm text-neutral-500 dark:text-neutral-400 mt-1">{{ _t("forbidden.body") }}</p>
        </div>
      </div>

      <div class="flex flex-col gap-3">
        <a href="javascript:history.back()"
           class="w-full py-2.5 px-4 rounded-lg text-sm font-semibold text-center
                  bg-neutral-100 dark:bg-neutral-800 hover:bg-neutral-200 dark:hover:bg-neutral-700
                  text-neutral-700 dark:text-neutral-200 transition-colors">
          ← {{ _t("Previous") }}
        </a>
        <a href="/logout"
           class="w-full py-2.5 px-4 rounded-lg text-sm font-semibold text-center
                  bg-red-50 dark:bg-red-900/20 hover:bg-red-100 dark:hover:bg-red-900/30
                  text-red-700 dark:text-red-400 transition-colors">
          {{ _t("Logout") }}
        </a>
      </div>

    </div>
  </div>

</body>
</html>
