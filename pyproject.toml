[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = [
    "B008",   # FastAPI uses function calls in Depends()
    "N815",   # Pydantic field names use mixedCase / UPPER_CASE
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (no external services)",
    "integration: Integration tests (requires mock server)",
    "e2e: End-to-end Playwright tests (require a live server + browser; deselected from the bare gate)",
]
addopts = "-v --tb=short -m 'not e2e'"

[tool.coverage.run]
source = ["backend"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
